name: Dependency audit

on:
  push:
    branches: [chore/dependency-audit]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=low || true
      - name: Audit production dependencies only
        run: npm audit --omit=dev --audit-level=low || true
